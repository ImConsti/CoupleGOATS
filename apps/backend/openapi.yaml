openapi: 3.1.0
info:
  title: CoupleGOATS API
  version: 1.0.0
  description:
    Aktuell implementierte REST-Endpunkte. Die interaktive Dokumentation ist unter /api/docs
    erreichbar.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Shelter Animals
  - name: Master Data
paths:
  /auth/register/user:
    post:
      tags:
        - Auth
      summary: Adoptierenden-Konto anlegen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/register/shelter:
    post:
      tags:
        - Auth
      summary: Tierheim-Konto anlegen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShelterRegistration"
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login für beide Rollen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Eingeloggt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      description: "Admin-Konten melden sich mit role: user an und erhalten role: admin zurück."
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      responses:
        "204":
          description: Ausgeloggt
        "401":
          $ref: "#/components/responses/Unauthorized"
      description: Der Token wird serverseitig nicht widerrufen; Clients müssen ihn selbst verwerfen.
      security:
        - bearerAuth: []
  /auth/me:
    get:
      tags:
        - Auth
      summary: Eingeloggtes Konto und Rolle
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []
  /shelters/me/animals:
    get:
      tags:
        - Shelter Animals
      summary: Eigene Tiere paginiert laden
      description: Nur für angemeldete Tierheime. Sortierung, Suche und Filter werden vor der Pagination angewendet.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Seitennummer, beginnend bei 1.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Anzahl der Tierprofile pro Seite.
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, createdAt]
            default: name
          description: Feld für die Sortierung.
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sortierrichtung.
        - in: query
          name: speciesId
          schema:
            type: string
            format: uuid
          description: Nur Tiere dieser Tierart laden.
        - in: query
          name: search
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Nach einem Teil des Tiernamens suchen.
      responses:
        "200":
          description: Seite mit eigenen Tierprofilen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAnimalProfiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
    post:
      tags:
        - Shelter Animals
      summary: Tier anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnimalCreate"
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimalProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      security:
        - bearerAuth: []
  /shelters/me/animals/{animalId}:
    parameters:
      - $ref: "#/components/parameters/AnimalId"
    get:
      tags:
        - Shelter Animals
      summary: Eigenes Tier laden
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimalProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
      security:
        - bearerAuth: []
    patch:
      tags:
        - Shelter Animals
      summary: Tier bearbeiten
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnimalUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimalProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      security:
        - bearerAuth: []
      description:
        "Mindestens ein Feld ist erforderlich. breedId: null entfernt die Rasse. tagIds ersetzt
        alle bisherigen Tags."
  /shelters/me/animals/{animalId}/tags:
    put:
      tags:
        - Shelter Animals
      summary: Tags eines Tiers ersetzen
      parameters:
        - $ref: "#/components/parameters/AnimalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceAnimalTags"
      responses:
        "200":
          description: Aktualisierte Tags, nach Namen sortiert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /species:
    get:
      tags:
        - Master Data
      summary: Tierarten auflisten
      security: []
      responses:
        "200":
          description: Nach Namen sortiert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Species"
  /species/{speciesId}/breeds:
    get:
      tags:
        - Master Data
      summary: Rassen einer Tierart
      security: []
      parameters:
        - $ref: "#/components/parameters/SpeciesId"
      responses:
        "200":
          description: Nach Namen sortiert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Breed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /tags:
    get:
      tags:
        - Master Data
      summary: Tags auflisten
      security: []
      responses:
        "200":
          description: Nach Kategorie gruppiert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagGroup"
      description: Leere Kategorien werden weggelassen. Kategorien und Tags sind alphabetisch sortiert.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AnimalId:
      name: animalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpeciesId:
      name: speciesId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Ungültige Eingabe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Ungültige Anmeldedaten oder fehlender beziehungsweise ungültiger Bearer-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Keine Berechtigung für diese Ressource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Ressource nicht gefunden oder gehört nicht zum angemeldeten Tierheim
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Existiert bereits
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Ungültiger Verweis auf Tierart, Rasse oder Tag
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      enum:
        - user
        - shelter
        - admin
    Gender:
      type: string
      enum:
        - male
        - female
        - unknown
    ExperienceLevel:
      type: string
      enum:
        - beginner
        - experienced
        - expert
    TagCategory:
      type: string
      enum:
        - personality
        - energy level
        - training & experience
        - living environment
        - social behavior
        - time & attention
        - special needs
        - lifestyle
    AuthResponse:
      type: object
      required:
        - token
        - role
        - id
      properties:
        token:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        id:
          type: string
          format: uuid
    BreedSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Tag:
      type: object
      required:
        - id
        - name
        - category
        - affectsMatching
        - isCritical
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/TagCategory"
        affectsMatching:
          type: boolean
        isCritical:
          type: boolean
    TagGroup:
      type: object
      required:
        - category
        - tags
      properties:
        category:
          $ref: "#/components/schemas/TagCategory"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT_ERROR
                - UNPROCESSABLE_ENTITY
                - DATABASE_ERROR
                - INTERNAL_SERVER_ERROR
            message:
              type: string
    CurrentAccount:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
    Login:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum:
            - user
            - shelter
    UserRegistration:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
        - streetAddress
        - postalCode
        - city
        - houseType
        - hasGarden
        - hasChildren
        - roamingPossible
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        streetAddress:
          type: string
        postalCode:
          type: string
          pattern: ^[0-9]{5}$
        city:
          type: string
        houseType:
          type: string
          enum:
            - apartment
            - house
        hasGarden:
          type: boolean
        hasChildren:
          type: boolean
        roamingPossible:
          type: boolean
    ShelterRegistration:
      type: object
      required:
        - name
        - email
        - password
        - streetAddress
        - postalCode
        - city
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        streetAddress:
          type: string
        postalCode:
          type: string
          pattern: ^[0-9]{5}$
        city:
          type: string
    Species:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Breed:
      type: object
      required:
        - id
        - speciesId
        - name
      properties:
        id:
          type: string
          format: uuid
        speciesId:
          type: string
          format: uuid
        name:
          type: string
    TagIds:
      type: array
      maxItems: 40
      uniqueItems: true
      items:
        type: string
        format: uuid
    AnimalCreate:
      type: object
      required:
        - name
        - speciesId
        - birthYear
        - gender
        - requiredExperience
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        speciesId:
          type: string
          format: uuid
        birthYear:
          type: integer
          minimum: 1900
          description: Darf nicht in der Zukunft liegen.
        gender:
          $ref: "#/components/schemas/Gender"
        requiredExperience:
          $ref: "#/components/schemas/ExperienceLevel"
        description:
          type: string
          minLength: 1
          maxLength: 2000
        tagIds:
          $ref: "#/components/schemas/TagIds"
        breedId:
          type: string
          format: uuid
    AnimalUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        speciesId:
          type: string
          format: uuid
        birthYear:
          type: integer
          minimum: 1900
          description: Darf nicht in der Zukunft liegen.
        gender:
          $ref: "#/components/schemas/Gender"
        requiredExperience:
          $ref: "#/components/schemas/ExperienceLevel"
        description:
          type: string
          minLength: 1
          maxLength: 2000
        tagIds:
          $ref: "#/components/schemas/TagIds"
        breedId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
    ReplaceAnimalTags:
      type: object
      required:
        - tagIds
      additionalProperties: false
      properties:
        tagIds:
          $ref: "#/components/schemas/TagIds"
    AnimalProfile:
      type: object
      required:
        - id
        - animalShelterId
        - name
        - species
        - breed
        - birthYear
        - gender
        - requiredExperience
        - description
        - createdAt
        - updatedAt
        - tags
      properties:
        id:
          type: string
          format: uuid
        animalShelterId:
          type: string
          format: uuid
        name:
          type: string
        species:
          $ref: "#/components/schemas/Species"
        breed:
          oneOf:
            - $ref: "#/components/schemas/BreedSummary"
            - type: "null"
        birthYear:
          type: integer
        gender:
          $ref: "#/components/schemas/Gender"
        requiredExperience:
          $ref: "#/components/schemas/ExperienceLevel"
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    PaginatedAnimalProfiles:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnimalProfile"
        meta:
          type: object
          required: [page, limit, total]
          properties:
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
