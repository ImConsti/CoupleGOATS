name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/imconsti/couplegoats-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/imconsti/couplegoats-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  bump-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ConstisNodeHarbor/nodeharbor-production
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - run: |
          for app in frontend backend; do
            sed -i "s#image: ghcr.io/imconsti/couplegoats-${app}:.*#image: ghcr.io/imconsti/couplegoats-${app}:${{ github.sha }}#" \
              infra/customers/couplegoats/${app}.yaml
          done

      - run: |
          git config user.name "nodeharbor-ci"
          git config user.email "ci@nodeharbor.local"
          git add infra/customers/couplegoats/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: couplegoats@${{ github.sha }}"
          # Other customers' bump jobs push to the same branch.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
