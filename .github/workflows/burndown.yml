# AI-generated code
name: Burndown Chart

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  burndown:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirementsBDC.txt

      - name: Burndown-Skript ausführen
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          OWNER: "ImConsti"
          PROJECT_NUMBER: "1"
        run: python burndown.py

      - name: Historische Dateien prüfen
        run: |
          test -d burndown-history

          echo "Gespeicherte Burndown-Dateien:"
          find burndown-history \
            -maxdepth 1 \
            -type f \
            \( -name '*.csv' -o -name '*.png' \) \
            -printf '%f (%k KB)\n' | sort

          echo "PNG-Dateien prüfen:"
          find burndown-history \
            -maxdepth 1 \
            -type f \
            -name '*.png' \
            -print0 | xargs -0 -r file

          git status --short

      - name: Ergebnisse speichern
        run: |
          git add -A

          git diff --cached --quiet || (
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update burndown chart history"
            git push
          )
